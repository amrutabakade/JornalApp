$kind: http-request
name: Update Journal Entry
method: PUT
url: '{{baseUrl}}/jrnl/{{entryId}}'
description: 'Update an existing journal entry by its ID.'
auth:
  type: basic
  credentials:
    - key: username
      value: '{{username}}'
    - key: password
      value: '{{password}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Title",
      "content": "Updated content for this journal entry."
    }
pathVariables:
  - key: entryId
    value: your-entry-id-here
